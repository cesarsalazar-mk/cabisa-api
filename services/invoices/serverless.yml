service: ca-invoices

plugins:
  - serverless-offline

custom:
  config: ../../envs/credentials.${self:provider.stage}.json

provider:
  timeout: 30
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  deploymentBucket:
    name: ${file(${self:custom.config}):deploymentBucket}
  environment:
    STAGE: ${file(${self:custom.config}):stage}
    ACCOUNT_ID: ${file(${self:custom.config}):awsAccountId}
    FILE_ENVIRONMENT: ${file(${self:custom.config}):fileEnvironment}
    RUN_LIKE: ${file(${self:custom.config}):run_like}
    DATABASE_HOST: ${file(${self:custom.config}):dbHost}
    DATABASE_USER: ${file(${self:custom.config}):dbUser}
    DATABASE_NAME: ${file(${self:custom.config}):dbName}
    DATABASE_PASSWORD: ${file(${self:custom.config}):dbPassword}
    CERTIFIER_URL: ${file(${self:custom.config}):certifierUrl}
    SIGNATURE_USER_SAT: ${file(${self:custom.config}):signatureUserSat}
    SIGNATURE_KEY_SAT: ${file(${self:custom.config}):signatureKeySat}
    API_USER_SAT: ${file(${self:custom.config}):apiUserSat}
    API_KEY_SAT: ${file(${self:custom.config}):apiKeySat}
    IDENTIFIER_SAT: ${file(${self:custom.config}):identifierSat}

package:
  exclude:
    - node_modules/**
  include:
    - ../../globals/**
functions:
  invoicesVersion:
    handler: handler.readServiceVersion
    events:
      - http:
          path: invoices/version
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoices:
    handler: handler.read
    events:
      - http:
          path: invoices
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesPaymentMethod:
    handler: handler.readPaymentMethods
    events:
      - http:
          path: invoices/payment-methods
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesStatus:
    handler: handler.readInvoicesStatus
    events:
      - http:
          path: invoices-status
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesServiceTypes:
    handler: handler.readInvoiceServiceType
    events:
      - http:
          path: invoices/service-types
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesCreditDays:
    handler: handler.readCreditDays
    events:
      - http:
          path: invoices/credit-days
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesCrediStatus:
    handler: handler.readCreditStatus
    events:
      - http:
          path: invoices/credit-status
          method: get
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesCreate:
    handler: handler.create
    events:
      - http:
          path: invoices
          method: post
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesDraft:
    handler: handler.draft
    timeout: 30
    events:
      - http:
          path: invoices/draft
          method: post
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesCertify:
    handler: handler.certify
    timeout: 30
    events:
      - http:
          path: invoices/{document_id}/certify
          method: post
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesUpdate:
    handler: handler.update
    events:
      - http:
          path: invoices
          method: put
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}

  invoicesCancel:
    handler: handler.cancel
    events:
      - http:
          path: invoices/cancel
          method: put
          cors: true
    layers:
      - arn:${file(${self:custom.config}):layer}
